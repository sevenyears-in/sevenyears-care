<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet · Seven Years Care</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f7f9fb; color: #161616; }
  .card { max-width: 340px; margin: 16px; padding: 28px; background: #fff; border-radius: 24px;
          box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 50%; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: rgba(0,0,0,.6); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button { background: #ff5e79; color: #fff; border: 0; border-radius: 16px; padding: 12px 20px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/app-icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Seven Years Care needs an internet connection. Check your mobile data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
